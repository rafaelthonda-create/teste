name: Add issue on branch

on:
  workflow_dispatch:
    inputs:
      issue_key:
        description: "Issue key(s), comma-separated (ex: SPARTA-1234,SPARTA-5678)"
        required: true
        type: string
      source_branch:
        description: "Source branch (ex: main)"
        required: true
        type: string
      target_branch:
        description: "Target branch (ex: release/1.2.3)"
        required: true
        type: string
      dry_run:
        description: "If true, only list commits without cherry-pick or push"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  cherry-pick-direct:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ inputs.source_branch }}" = "${{ inputs.target_branch }}" ]; then
            echo "source_branch and target_branch cannot be the same"
            exit 1
          fi

      - name: Fetch remote branches
        run: |
          git fetch origin "${{ inputs.source_branch }}" "${{ inputs.target_branch }}"

      - name: Checkout target branch
        if: ${{ !inputs.dry_run }}
        run: |
          git checkout "${{ inputs.target_branch }}"
          git pull origin "${{ inputs.target_branch }}"

      - name: Find commits by issue key
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          ISSUE_KEYS_RAW="${{ inputs.issue_key }}"
          SOURCE_REF="origin/${{ inputs.source_branch }}"
          TARGET_REF="origin/${{ inputs.target_branch }}"

          IFS=',' read -r -a ISSUE_KEYS <<< "$ISSUE_KEYS_RAW"

          GREP_ARGS=()
          for issue in "${ISSUE_KEYS[@]}"; do
            issue_trimmed="$(echo "$issue" | xargs)"
            [ -z "$issue_trimmed" ] && continue
            GREP_ARGS+=("--grep=$issue_trimmed")
          done

          if [ "${#GREP_ARGS[@]}" -eq 0 ]; then
            echo "No valid issue key provided in 'issue_key' input"
            exit 1
          fi

          SHAS=$(git log "$SOURCE_REF" \
            "${GREP_ARGS[@]}" \
            --regexp-ignore-case \
            --format=%H \
            --reverse \
            --not "$TARGET_REF" | awk '!seen[$0]++')

          if [ -z "$SHAS" ]; then
            echo "No commits found for issue key(s) '$ISSUE_KEYS_RAW' in $SOURCE_REF that are not already in $TARGET_REF"
            exit 1
          fi

          FILTERED=""
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue

            if git log "$TARGET_REF" \
              --grep="cherry picked from commit $sha" \
              --fixed-strings \
              --format=%H -n 1 | grep -q .; then
              echo "Skipping already cherry-picked: $sha"
              continue
            fi

            FILTERED="${FILTERED}${sha}"$'\n'
          done <<< "$SHAS"

          if [ -z "$FILTERED" ]; then
            echo "No new commits to cherry-pick for issue key(s) '$ISSUE_KEYS_RAW'"
            echo "has_commits=false" >> "$GITHUB_OUTPUT"
            echo "shas=" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "has_commits=true" >> "$GITHUB_OUTPUT"

          echo "shas<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILTERED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          echo "Commits to cherry-pick:"
          echo "$FILTERED"

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "Dry run enabled. No cherry-pick or push will be executed."
          echo "Issue key(s): ${{ inputs.issue_key }}"
          echo "Source branch: ${{ inputs.source_branch }}"
          echo "Target branch: ${{ inputs.target_branch }}"
          echo "Commits found:"
          echo "${{ steps.discover.outputs.shas }}"

      - name: Cherry-pick commits
        if: ${{ !inputs.dry_run && steps.discover.outputs.has_commits == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            echo "Applying $sha"

            if ! git cherry-pick -x "$sha"; then
              echo "Conflict while cherry-picking $sha"
              git cherry-pick --abort || true
              exit 1
            fi
          done <<< "${{ steps.discover.outputs.shas }}"

      - name: Push directly to target branch
        if: ${{ !inputs.dry_run && steps.discover.outputs.has_commits == 'true' }}
        run: |
          git push origin HEAD:"${{ inputs.target_branch }}"
